name: "mobbdev"
description: "Mobb automatic vulnerability fixer action"
branding:
  icon: aperture
  color: blue
inputs:
  report-file:
    description: "Path to SAST report file. Omitting this input enables Mobb's scan-and-fix mode: the Mobb CLI performs its own internal SAST scan (via opengrep) instead of consuming an external report."
    required: false
  api-key:
    description: "Mobb API key"
    required: true
  github-token:
    description: "GitaHub Token"
    required: true
  scanner:
    description: "SAST scanner (codeql, snyk, checkmarx, fortify). Required when report-file is provided; can be omitted in scan-and-fix mode (no report-file)."
    required: false
  mobb-project-name:
    description: "Mobb Project Name"
    required: false
outputs:
  fix-report-url:
    description: "Mobb fix report URL"
    value: ${{ steps.run-npx-mobb-dev.outputs.fix-report-url }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v3.6.0
      with:
        node-version: 20

    - id: run-npx-mobb-dev
      run: |
        REPO="${{ github.server_url }}/${{ github.repository }}"
        GITHUB_TOKEN=${{ inputs.github-token }}
        SCANNER=${{ inputs.scanner }}
        COMMIT_HASH="${{ github.event.pull_request.head.sha }}"
        PR_NUMBER=${{ github.event.pull_request.number }}
        VUL_FILE_PATH="${{ inputs.report-file }}"
        MobbExecString="npx --yes mobbdev@latest review  -r $REPO --ref $GITHUB_HEAD_REF --ch $COMMIT_HASH --api-key ${{ inputs.api-key }} --pr $PR_NUMBER --github-token ${{ inputs.github-token }}"

        # Append -f only if a report file was provided. When omitted, Mobb runs in scan-and-fix mode (internal opengrep scan).
        if [ -n "$VUL_FILE_PATH" ]; then
          echo "report-file specified: $VUL_FILE_PATH"
          MobbExecString+=" -f $VUL_FILE_PATH"
        else
          echo "No report-file provided. Running in scan-and-fix mode (Mobb CLI will perform internal SAST scan)."
        fi

        # Append --scanner only if provided. Required when feeding an external report; not needed in scan-and-fix mode.
        if [ -n "$SCANNER" ]; then
          echo "scanner specified: $SCANNER"
          MobbExecString+=" --scanner $SCANNER"
        else
          echo "No scanner provided."
        fi

        # Check if mobb-project-name exists and append it
        if [ -n "${{ inputs.mobb-project-name }}" ]; then
          echo "mobb-project-name specified: ${{ inputs.mobb-project-name }}"
          MobbExecString+=" --mobb-project-name \"${{ inputs.mobb-project-name }}\""
        fi

        # Output the final command string for debugging
        echo "Mobb Command: $MobbExecString"
        OUT=$(eval $MobbExecString || true)
        OUT=$(echo $OUT | tr '\n' ' ')
        MOBB_URL=$(echo "$OUT" | grep -oE 'https://[^ ]+' | head -1)

        echo "fix-report-url=$MOBB_URL" >> $GITHUB_OUTPUT
        echo "Mobb URL: $MOBB_URL"

      shell: bash -l {0}

    - uses: Sibz/github-status-action@v1
      if: ${{ startsWith(steps.run-npx-mobb-dev.outputs.fix-report-url, 'https://') }}
      with:
        authToken: ${{ inputs.github-token }}
        context: "Mobb fix report link"
        state: "success"
        target_url: ${{ steps.run-npx-mobb-dev.outputs.fix-report-url }}
        sha: ${{github.event.pull_request.head.sha || github.sha}}
