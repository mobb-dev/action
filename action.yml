name: "mobbdev"
description: "Mobb automatic vulnerability fixer action"
branding:
  icon: aperture
  color: blue
inputs:
  report-file:
    description: "Path to SAST report file. Omitting this input enables Mobb's scan-and-fix mode: the Mobb CLI performs its own internal SAST scan instead of consuming an external report."
    required: false
  api-key:
    description: "Mobb API key"
    required: true
  github-token:
    description: "GitHub Token"
    required: true
  mobb-project-name:
    description: "Mobb Project Name"
    required: false
  auto-pr:
    description: "Auto-PR flag"
    required: false
  commit-directly:
    description: "Commit Directly flag, this requires Auto-PR flag to be set. Once enabled, Mobb will commit the fixes directly to the branch"
    required: false
  create-one-pr:
    description: "true or false (default false). Create a single unified pull request for all fixes instead of one PR per fix. Requires auto-pr to be set."
    required: false
    default: "false"
  organization-id:
    description: "Organization ID"
    required: false
  polling:
    description: "true or false (default false). Use HTTP polling instead of WebSocket for status updates. Enable this on runners behind proxies or firewalls that block WebSocket connections."
    required: false
    default: "false"
  scan-only:
    description: "true or false (default false). Run the Mobb scan and report findings without generating fixes."
    required: false
    default: "false"
  diff-aware:
    description: "Part of Mobb's scan-and-fix mode (enabled by omitting report-file). When true and the workflow is triggered by a pull_request event, Mobb performs a diff-aware scan limited to changes since the PR base SHA (passed as --baseline-commit). Has no effect outside PR context. Defaults to false."
    required: false
    default: "false"

outputs:
  fix-report-url:
    description: "Mobb fix report URL"
    value: ${{ steps.run-npx-mobb-dev.outputs.fix-report-url }}
runs:
  using: "composite"
  steps:
    # npx itself needs a Node runtime. The Mobb CLI is shipped as a prebuilt
    # standalone binary (@mobb.ai/cli) so it no longer cares which Node version
    # this installs, but container and self-hosted runners still rely on this
    # step to provide one at all.
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - id: run-npx-mobb-dev
      run: |
        REPO=$(git remote get-url origin)
        REPO=${REPO%".git"}
        BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}

        MobbExecString="npx --yes @mobb.ai/cli@latest analyze --ci -r $REPO --ref $BRANCH --api-key ${{ inputs.api-key }}"

        # Append -f only if a report file was provided. When omitted, Mobb runs in scan-and-fix mode (internal SAST scan).
        if [ -n "${{ inputs.report-file }}" ]; then
          echo "report-file specified: ${{ inputs.report-file }}"
          MobbExecString+=" -f ${{ inputs.report-file }}"
        else
          echo "No report-file provided. Running in scan-and-fix mode (Mobb CLI will perform internal SAST scan)."
        fi

        # Check if mobb-project-name exists and append it
        if [ -n "${{ inputs.mobb-project-name }}" ]; then
          echo "mobb-project-name specified: ${{ inputs.mobb-project-name }}"
          MobbExecString+=" --mobb-project-name \"${{ inputs.mobb-project-name }}\""
        fi

        # Check if organization-id exists and append it
        if [ -n "${{ inputs.organization-id }}" ]; then
          echo "organization-id specified: ${{ inputs.organization-id }}"
          MobbExecString+=" --organization-id \"${{ inputs.organization-id }}\""
        fi

        # Check if auto-pr flag is set append it
        if [ "${{ inputs.auto-pr }}" == "true" ]; then
          echo "Auto-PR flag is set"
          MobbExecString+=" --auto-pr"

          # create-one-pr only applies on top of --auto-pr
          if [ "${{ inputs.create-one-pr }}" == "true" ]; then
            echo "Create-One-PR flag is set"
            MobbExecString+=" --create-one-pr"
          fi
        fi

        # Check if commit-directly flag is set append it to the Mobb CLI command
        if [ "${{ inputs.commit-directly }}" == "true" ]; then
          echo "Commit Directly flag is set"
          MobbExecString+=" --commit-directly"

          # Check if the action is running in the context of a pull request
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            PR_ID="${{ github.event.pull_request.number }}"
            echo "Pull Request ID detected: $PR_ID"
            MobbExecString+=" --pr-id $PR_ID"
          else
            echo "No Pull Request detected. Skipping --pr-id flag."
          fi
        fi

        # Check if polling flag is set and append it
        if [ "${{ inputs.polling }}" == "true" ]; then
          echo "Polling flag is set (HTTP polling instead of WebSocket)"
          MobbExecString+=" --polling"
        fi

        # Check if scan-only flag is set and append it
        if [ "${{ inputs.scan-only }}" == "true" ]; then
          echo "Scan-only flag is set (findings will be reported without fixes)"
          MobbExecString+=" --scan-only"
        fi

        # When diff-aware scan-and-fix is enabled and we are in a PR context, point --baseline-commit at the PR base SHA.
        if [ "${{ inputs.diff-aware }}" == "true" ]; then
          BASELINE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASELINE_SHA" ]; then
            echo "diff-aware enabled, using baseline commit: $BASELINE_SHA"
            MobbExecString+=" --baseline-commit $BASELINE_SHA"
          else
            echo "diff-aware enabled but no pull_request context detected; skipping --baseline-commit."
          fi
        fi

        # Output the final command string for debugging and execute it
        echo "Mobb Command: $MobbExecString"
        OUT=$(eval $MobbExecString)

        RETVAL=$?
        if [ $RETVAL -ne 0 ]; then
          exit $RETVAL
        fi
        OUT=$(echo "$OUT" | tr '\n' ' ')
        MOBB_URL=$(echo "$OUT" | grep -oE 'https://[^ ]+' | head -1)
        echo "fix-report-url=$MOBB_URL" >> $GITHUB_OUTPUT
        echo "Mobb URL: $MOBB_URL"

      shell: bash -l {0}
    - uses: Sibz/github-status-action@v1
      if: ${{ startsWith(steps.run-npx-mobb-dev.outputs.fix-report-url, 'https://') }}
      with:
        authToken: ${{ inputs.github-token }}
        context: "Mobb fix report link"
        state: "success"
        target_url: ${{ steps.run-npx-mobb-dev.outputs.fix-report-url }}
        sha: ${{github.event.pull_request.head.sha || github.sha}}
