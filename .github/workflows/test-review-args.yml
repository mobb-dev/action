# Argument-construction tests for the review action (GitHub Fixer).
#
# Kept separate from test-analyze-args.yml on purpose: review mode has different
# hard requirements from analyze mode, and a review regression should show up as
# its own red check rather than being buried in an analyze failure.
#
# MOBB_ACTION_DRY_RUN makes the action build its CLI command, publish it as the
# `mobb-command` output, and stop before executing it - so this needs no secrets
# and makes no API calls.
name: Test review args

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  MOBB_ACTION_DRY_RUN: "true"

jobs:
  review-args:
    name: review command construction
    # The review action requires a pull_request context (--ch and --pr), so the
    # happy-path assertions only mean anything on a pull_request event.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- happy path -------------------------------------------------------
      - id: review
        uses: ./review
        with:
          report-file: results/javascript.sarif
          scanner: codeql
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert review command
        env:
          CMD: ${{ steps.review.outputs.mobb-command }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$CMD"
          [[ "$CMD" == "npx --yes @mobb.ai/cli@latest review "* ]] \
            || { echo "::error::command does not invoke @mobb.ai/cli review"; exit 1; }
          fail=0
          for expected in '-f results/javascript.sarif' '--scanner codeql' \
                          "--ch $HEAD_SHA" "--pr $PR_NUMBER" '--github-token'; do
            grep -q -- "$expected" <<<"$CMD" || { echo "::error::missing $expected"; fail=1; }
          done
          exit "$fail"

      # --- pass-through inputs ---------------------------------------------
      - id: passthrough
        uses: ./review
        with:
          report-file: results/javascript.sarif
          scanner: snyk
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          mobb-project-name: action-ci
          src-path: ./js_vuln_files
          polling: "true"

      - name: assert pass-through flags
        env:
          CMD: ${{ steps.passthrough.outputs.mobb-command }}
        run: |
          echo "$CMD"
          fail=0
          for expected in '--scanner snyk' '--mobb-project-name "action-ci"' \
                          '-p "./js_vuln_files"' '--polling'; do
            grep -q -- "$expected" <<<"$CMD" || { echo "::error::missing $expected"; fail=1; }
          done
          exit "$fail"

      # --- negative: no report-file ----------------------------------------
      # The CLI hard-requires -f on review, so the action must reject this up
      # front instead of letting the CLI fail and the step go green.
      - id: no-report-file
        continue-on-error: true
        uses: ./review
        with:
          scanner: codeql
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert missing report-file is rejected
        env:
          OUTCOME: ${{ steps.no-report-file.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::review without report-file should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"

      # --- negative: no scanner --------------------------------------------
      - id: no-scanner
        continue-on-error: true
        uses: ./review
        with:
          report-file: results/javascript.sarif
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert missing scanner is rejected
        env:
          OUTCOME: ${{ steps.no-scanner.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::review without scanner should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"

      # --- negative: scanner not in the CLI's choices ----------------------
      - id: bad-scanner
        continue-on-error: true
        uses: ./review
        with:
          report-file: results/javascript.sarif
          scanner: not-a-real-scanner
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert an unsupported scanner is rejected
        env:
          OUTCOME: ${{ steps.bad-scanner.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::an unsupported scanner should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"

  review-args-no-pr-context:
    name: review rejects a non-pull_request context
    # Outside a pull_request there is no --ch or --pr, both of which the CLI
    # requires, so the action must refuse to run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: no-pr
        continue-on-error: true
        uses: ./review
        with:
          report-file: results/javascript.sarif
          scanner: codeql
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert a missing pull_request context is rejected
        env:
          OUTCOME: ${{ steps.no-pr.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::review outside a pull_request context should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"
