# Contract tests against the Mobb CLI (@mobb.ai/cli).
#
# These need no secrets and make no API calls - yargs validates arguments before
# any network I/O - so they run on fork pull requests and cost no Mobb quota.
#
# The point of this workflow is to catch two classes of break early:
#
#   1. Packaging. @mobb.ai/cli is a ~3 KB launcher that resolves a platform
#      binary from optionalDependencies and spawns it. It does not download
#      anything at runtime, so it hard-fails wherever that optional dep is
#      absent: musl/Alpine, win-arm64, or any environment where optional deps
#      are skipped (npm --no-optional, or omit=optional in an .npmrc).
#   2. Flag drift. If the CLI renames or starts requiring a flag the actions
#      pass, the actions break. The analyze-contract and review-contract jobs
#      below assert the flags each action emits still exist.
name: CLI smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so CLI-side regressions surface even with no open pull request.
    - cron: "23 6 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CLI: "@mobb.ai/cli@latest"

jobs:
  binary-ubuntu:
    # Required leg. Ubuntu is what the actions actually run on, so this must be
    # green for the migration to be considered working.
    name: binary smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: CLI launches and lists its subcommands
        run: |
          npx --yes "$CLI" --help > help.txt
          cat help.txt
          fail=0
          for cmd in scan analyze review add-scm-token convert-to-sarif; do
            if ! grep -q "mobbdev $cmd" help.txt; then
              echo "::error::subcommand '$cmd' is missing from the CLI"
              fail=1
            fi
          done
          exit "$fail"

  binary-other-os:
    # Informational only: a packaging gap on macOS or Windows is worth seeing but
    # must not block a PR, since the composite actions are bash-only and run on
    # Linux. Note this leg exercises the CLI itself, not the actions.
    name: binary smoke (${{ matrix.os }}, informational)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: CLI launches
        run: npx --yes "$CLI" --help

  analyze-contract:
    # Asserts the flags the root action passes to `analyze` still exist.
    name: analyze flag contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: analyze still documents every flag the root action passes
        run: |
          npx --yes "$CLI" analyze --help > analyze-help.txt
          cat analyze-help.txt
          fail=0
          for flag in --ci --auto-pr --commit-directly --create-one-pr --pr-id \
                      --baseline-commit --polling --scan-only --organization-id \
                      --mobb-project-name --scan-file --src-path --api-key --ref; do
            if ! grep -q -- "$flag" analyze-help.txt; then
              echo "::error::analyze no longer documents $flag, which action.yml passes"
              fail=1
            fi
          done
          exit "$fail"

      - name: analyze keeps -f optional so scan-and-fix mode still works
        run: |
          npx --yes "$CLI" analyze --help > analyze-help.txt
          if grep -- '--scan-file' analyze-help.txt | grep -q '\[required\]'; then
            echo "::error::analyze -f/--scan-file became required; the root action's scan-and-fix mode (omitting report-file) is broken"
            exit 1
          fi
          echo "ok: -f is still optional"

      # The two checks below track CLI constraints that action.yml's input
      # validation mirrors. They emit notices rather than failing: if the CLI
      # relaxes a constraint, nothing breaks, but the action's guard becomes
      # unnecessarily strict and should be revisited.
      - name: analyze still couples --pr-id to --commit-directly
        run: |
          set +e
          out=$(npx --yes "$CLI" analyze --ci -r https://github.com/mobb-dev/action \
                  --api-key FAKE --auto-pr --pr-id 1 2>&1)
          set -e
          echo "$out"
          if grep -q 'requires --commit-directly' <<<"$out"; then
            echo "ok: --pr-id still requires --commit-directly, which is why action.yml only passes --pr-id alongside commit-directly"
          else
            echo "::notice::the CLI no longer couples --pr-id to --commit-directly; action.yml could pass --pr-id on plain --auto-pr runs too"
          fi

      - name: analyze still rejects --create-one-pr with --commit-directly
        run: |
          set +e
          out=$(npx --yes "$CLI" analyze --ci -r https://github.com/mobb-dev/action \
                  --api-key FAKE --auto-pr --create-one-pr --commit-directly 2>&1)
          set -e
          echo "$out"
          if grep -q 'cannot be provided at the same time' <<<"$out"; then
            echo "ok: still mutually exclusive, matching action.yml's guard"
          else
            echo "::notice::the CLI no longer rejects --create-one-pr with --commit-directly; action.yml's mutual-exclusion guard could be dropped"
          fi

  review-contract:
    # Separate job on purpose: review mode breaking must show up as its own red
    # check rather than being buried in an analyze failure.
    #
    # This is the standing alarm for the mismatch this migration fixed - the CLI
    # hard-requires -f, --scanner and --ch on review, so the review action cannot
    # offer a scan-and-fix mode.
    name: review flag contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: review still documents every flag the review action passes
        run: |
          npx --yes "$CLI" review --help > review-help.txt
          cat review-help.txt
          fail=0
          for flag in --scan-file --scanner --github-token --pull-request --ref \
                      --polling --src-path --api-key --mobb-project-name; do
            if ! grep -q -- "$flag" review-help.txt; then
              echo "::error::review no longer documents $flag, which review/action.yml passes"
              fail=1
            fi
          done
          exit "$fail"

      - name: review still requires -f, --scanner and --ch
        run: |
          set +e
          out=$(npx --yes "$CLI" review 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::a bare 'review' invocation unexpectedly succeeded; the review action's fail-fast guards assume these arguments are required"
            exit 1
          fi
          if ! grep -q 'Missing required arguments' <<<"$out"; then
            echo "::error::expected a 'Missing required arguments' error from a bare review invocation"
            exit 1
          fi
          fail=0
          for arg in f scanner ch; do
            if ! grep -E "Missing required arguments:.*(^|[ ,])$arg([ ,]|$)" <<<"$out" >/dev/null; then
              echo "::error::review no longer requires '$arg'. If it became optional, review/action.yml's fail-fast guard should be relaxed and scan-and-fix support revisited."
              fail=1
            fi
          done
          exit "$fail"

      - name: review still rejects --org (guards against wiring organization-id)
        run: |
          set +e
          out=$(npx --yes "$CLI" review --org 00000000-0000-0000-0000-000000000000 2>&1)
          set -e
          if grep -q 'Unknown argument: org' <<<"$out"; then
            echo "ok: review still rejects --org, so review/action.yml correctly omits organization-id"
          else
            echo "::notice::review now accepts --org; consider adding an organization-id input to review/action.yml"
          fi
