# Argument-construction tests for the root (analyze) action.
#
# MOBB_ACTION_DRY_RUN makes the action build its CLI command, publish it as the
# `mobb-command` output, and stop before executing it. So these tests assert the
# exact flags the action emits without calling the Mobb API - no secrets, no
# quota, runs on fork pull requests.
#
# Review mode has its own equivalent in test-review-args.yml.
name: Test analyze args

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  MOBB_ACTION_DRY_RUN: "true"

jobs:
  analyze-args:
    name: analyze command construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- fix-only mode: an external report is passed through as -f ---------
      - id: fix-only
        uses: ./
        with:
          report-file: report.json
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert fix-only command
        env:
          CMD: ${{ steps.fix-only.outputs.mobb-command }}
        run: |
          echo "$CMD"
          [[ "$CMD" == "npx --yes @mobb.ai/cli@latest analyze --ci "* ]] \
            || { echo "::error::command does not invoke @mobb.ai/cli analyze --ci"; exit 1; }
          grep -q -- '-f report.json' <<<"$CMD" || { echo "::error::missing -f report.json"; exit 1; }
          if grep -q -- '--auto-pr' <<<"$CMD"; then
            echo "::error::--auto-pr present without the input being set"; exit 1
          fi
          if grep -q -- '--scan-only' <<<"$CMD"; then
            echo "::error::--scan-only present without the input being set"; exit 1
          fi
          echo "ok"

      # --- scan-and-fix mode: no report-file means no -f --------------------
      - id: scan-and-fix
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}

      - name: assert scan-and-fix command omits -f
        env:
          CMD: ${{ steps.scan-and-fix.outputs.mobb-command }}
        run: |
          echo "$CMD"
          if grep -q -- ' -f ' <<<"$CMD"; then
            echo "::error::-f present in scan-and-fix mode; the CLI would consume a report instead of running its own scan"
            exit 1
          fi
          echo "ok"

      # --- auto-pr + create-one-pr + pr-id ---------------------------------
      - id: auto-pr
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          auto-pr: "true"
          create-one-pr: "true"

      - name: assert auto-pr command
        env:
          CMD: ${{ steps.auto-pr.outputs.mobb-command }}
        run: |
          echo "$CMD"
          grep -q -- '--auto-pr' <<<"$CMD" || { echo "::error::missing --auto-pr"; exit 1; }
          grep -q -- '--create-one-pr' <<<"$CMD" || { echo "::error::missing --create-one-pr"; exit 1; }
          # The CLI requires --pr-id to be accompanied by --commit-directly
          # ("--pull-request flag requires --commit-directly to be provided as
          # well"), so it must not appear on a plain --auto-pr run.
          if grep -q -- '--pr-id' <<<"$CMD"; then
            echo "::error::--pr-id was passed without --commit-directly; the CLI rejects that combination"
            exit 1
          fi
          echo "ok"

      # --- commit-directly -------------------------------------------------
      - id: commit-directly
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          auto-pr: "true"
          commit-directly: "true"

      - name: assert commit-directly command
        env:
          CMD: ${{ steps.commit-directly.outputs.mobb-command }}
        run: |
          echo "$CMD"
          grep -q -- '--commit-directly' <<<"$CMD" || { echo "::error::missing --commit-directly"; exit 1; }
          echo "ok"

      # --- pass-through inputs --------------------------------------------
      - id: passthrough
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          polling: "true"
          scan-only: "true"
          src-path: ./js_vuln_files
          organization-id: 00000000-0000-0000-0000-000000000000
          mobb-project-name: action-ci

      - name: assert pass-through flags
        env:
          CMD: ${{ steps.passthrough.outputs.mobb-command }}
        run: |
          echo "$CMD"
          fail=0
          for flag in '--polling' '--scan-only' '-p "./js_vuln_files"' \
                      '--organization-id "00000000-0000-0000-0000-000000000000"' \
                      '--mobb-project-name "action-ci"'; do
            grep -q -- "$flag" <<<"$CMD" || { echo "::error::missing $flag"; fail=1; }
          done
          exit "$fail"

      # --- diff-aware: only meaningful in a pull_request context -----------
      - id: diff-aware
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          diff-aware: "true"

      - name: assert diff-aware passes --baseline-commit
        if: github.event_name == 'pull_request'
        env:
          CMD: ${{ steps.diff-aware.outputs.mobb-command }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "$CMD"
          grep -q -- "--baseline-commit $BASE_SHA" <<<"$CMD" \
            || { echo "::error::missing --baseline-commit $BASE_SHA"; exit 1; }
          echo "ok"

      # --- negative: create-one-pr without auto-pr must fail --------------
      - id: bad-create-one-pr
        continue-on-error: true
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          create-one-pr: "true"

      - name: assert create-one-pr without auto-pr is rejected
        env:
          OUTCOME: ${{ steps.bad-create-one-pr.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::create-one-pr without auto-pr should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"

      # --- negative: create-one-pr together with commit-directly ------------
      # The CLI rejects this combination outright ("--create-one-pr and
      # --commit-directly cannot be provided at the same time"), so the action
      # must catch it first.
      - id: mutually-exclusive
        continue-on-error: true
        uses: ./
        with:
          api-key: dummy-api-key
          github-token: ${{ github.token }}
          auto-pr: "true"
          create-one-pr: "true"
          commit-directly: "true"

      - name: assert create-one-pr + commit-directly is rejected
        env:
          OUTCOME: ${{ steps.mutually-exclusive.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::create-one-pr together with commit-directly should fail the action, but the step outcome was '$OUTCOME'"
            exit 1
          fi
          echo "ok: rejected as expected"
